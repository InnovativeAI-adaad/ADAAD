  aeo-evidence-publish:
    runs-on: ubuntu-latest
    needs: [classify, release-evidence-readiness]
    # AEO-GATE-0: job is skipped (not failed) when secret is absent.
    # Provision AEO_EVIDENCE_DESTINATION in repo secrets to activate publishing.
    # This prevents an unconfigured secret from cascading through CI.
    if: ${{ secrets.AEO_EVIDENCE_DESTINATION != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Publish validated evidence bundle to configured AEO destination (fail-closed, no retries)
        env:
          AEO_EVIDENCE_DESTINATION: ${{ secrets.AEO_EVIDENCE_DESTINATION }}
        run: |
          set -euo pipefail
          test -n "${AEO_EVIDENCE_DESTINATION:-}" || { echo "AEO_EVIDENCE_DESTINATION is required (fail-closed)."; exit 1; }
          PYTHONPATH=. python scripts/publish_aeo_evidence_bundle.py --destination "${AEO_EVIDENCE_DESTINATION}"

