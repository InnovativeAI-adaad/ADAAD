name: CI

# QA-1: docs-validation and doc_sync_preview are complementary.
# - docs-validation enforces content/schema alignment invariants.
# - doc_sync_preview blocks merges when sync_docs_on_merge dry-run would mutate files.
# Both are required branch-protection checks for main.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      tests: ${{ steps.filter.outputs.tests }}
      governance: ${{ steps.filter.outputs.governance }}
      policy_touch: ${{ steps.filter.outputs.policy_touch }}
      runtime: ${{ steps.filter.outputs.runtime }}
      security: ${{ steps.filter.outputs.security }}
      amendment_logic: ${{ steps.filter.outputs.amendment_logic }}
      phase7_reputation_gate: ${{ steps.filter.outputs.phase7_reputation_gate }}
      web_assets_policy: ${{ steps.filter.outputs.web_assets_policy }}
      other: ${{ steps.filter.outputs.other }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      tests_only: ${{ steps.classify.outputs.tests_only }}
      gov_policy_flag: ${{ steps.classify.outputs.gov_policy_flag }}
      gov_replay_flag: ${{ steps.classify.outputs.gov_replay_flag }}
      pr_tier: ${{ steps.classify.outputs.pr_tier }}
      run_strict_replay: ${{ steps.classify.outputs.run_strict_replay }}
      run_evidence_suite: ${{ steps.classify.outputs.run_evidence_suite }}
      run_promotion_suite: ${{ steps.classify.outputs.run_promotion_suite }}
      run_shadow_governance_gate: ${{ steps.classify.outputs.run_shadow_governance_gate }}
      strict_replay_reason: ${{ steps.classify.outputs.strict_replay_reason }}
      evidence_reason: ${{ steps.classify.outputs.evidence_reason }}
      promotion_reason: ${{ steps.classify.outputs.promotion_reason }}
      shadow_governance_reason: ${{ steps.classify.outputs.shadow_governance_reason }}
      run_redteam_subset: ${{ steps.classify.outputs.run_redteam_subset }}
      redteam_reason: ${{ steps.classify.outputs.redteam_reason }}
      run_adversarial_scenarios: ${{ steps.classify.outputs.run_adversarial_scenarios }}
      adversarial_reason: ${{ steps.classify.outputs.adversarial_reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
            tests:
              - 'tests/**'
            governance:
              - 'governance/**'
              - 'docs/governance/**'
            policy_touch:
              - 'runtime/governance/constitution.yaml'
              - 'governance/**'
              - 'schemas/governance_policy*.json'
              - 'schemas/governance_policy_artifact*.json'
              - 'docs/schemas/constitution.v1.json'
              - 'docs/assets/**/*.svg'
              - 'docs/assets/qr/registry.json'
              - 'docs/manifest.json'
              - 'docs/sw.js'
              - 'scripts/validate_qr_registry.py'
              - 'scripts/generate_qr_assets.py'
              - 'scripts/validate_manifest_inventory.py'
            runtime:
              - 'runtime/**'
              - 'app/**'
              - 'server.py'
              - 'nexus_setup.py'
            security:
              - 'security/**'
            amendment_logic:
              - 'runtime/**/amendment*.py'
              - 'runtime/**/*amendment*.py'
              - 'governance/**/*amendment*'
              - 'tools/formal/**'
              - 'tests/**/amendment*'
            phase7_reputation_gate:
              - 'governance/**'
              - 'server.py'
              - 'ui/**'
            web_assets_policy:
              - 'docs/assets/**/*.svg'
              - 'docs/assets/qr/registry.json'
              - 'docs/manifest.json'
              - 'docs/sw.js'
              - 'scripts/validate_qr_registry.py'
              - 'scripts/generate_qr_assets.py'
              - 'scripts/validate_manifest_inventory.py'
            other:
              - '.github/**'
              - 'scripts/**'
              - 'tools/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
      - name: Compute CI tier and gates
        id: classify
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          DOCS: ${{ steps.filter.outputs.docs }}
          TESTS: ${{ steps.filter.outputs.tests }}
          GOVERNANCE: ${{ steps.filter.outputs.governance }}
          RUNTIME: ${{ steps.filter.outputs.runtime }}
          SECURITY: ${{ steps.filter.outputs.security }}
          POLICY_TOUCH: ${{ steps.filter.outputs.policy_touch }}
          WEB_ASSETS_POLICY: ${{ steps.filter.outputs.web_assets_policy }}
          OTHER: ${{ steps.filter.outputs.other }}
        run: |
          set -euo pipefail

          docs_only=false
          tests_only=false
          gov_policy_flag=false
          gov_replay_flag=false
          pr_tier=standard

          if [ "$DOCS" = "true" ] && [ "$TESTS" = "false" ] && [ "$GOVERNANCE" = "false" ] && [ "$RUNTIME" = "false" ] && [ "$SECURITY" = "false" ] && [ "$OTHER" = "false" ]; then
            docs_only=true
          fi

          if [ "$TESTS" = "true" ] && [ "$DOCS" = "false" ] && [ "$GOVERNANCE" = "false" ] && [ "$RUNTIME" = "false" ] && [ "$SECURITY" = "false" ] && [ "$OTHER" = "false" ]; then
            tests_only=true
          fi

          if [ "$IS_PR" = "true" ]; then
            if printf '%s\n' "$PR_BODY" | grep -Eiq -- '^- \[x\] Changes policy/constitution behavior$'; then
              gov_policy_flag=true
            fi
            if printf '%s\n' "$PR_BODY" | grep -Eiq -- '^- \[x\] Changes replay or ledger behavior$'; then
              gov_replay_flag=true
            fi
          fi

          if [ "$docs_only" = "true" ]; then
            pr_tier=docs
          elif [ "$tests_only" = "true" ]; then
            pr_tier=low
          elif [ "$GOVERNANCE" = "true" ] || [ "$RUNTIME" = "true" ] || [ "$SECURITY" = "true" ] || [ "$gov_policy_flag" = "true" ] || [ "$gov_replay_flag" = "true" ]; then
            pr_tier=critical
          fi

          run_strict_replay=false
          run_evidence_suite=false
          run_promotion_suite=false
          run_shadow_governance_gate=false
          strict_replay_reason='Skipped: no replay/runtime/security/governance trigger.'
          evidence_reason='Skipped: no evidence-impact trigger.'
          promotion_reason='Skipped: no promotion-impact trigger.'
          shadow_governance_reason='Skipped: no policy-impact trigger.'
          run_redteam_subset=false
          redteam_reason='Skipped: PR is not critical tier.'
          run_adversarial_scenarios=false
          adversarial_reason='Skipped: no governance/runtime/security/red-team threat model path changes.'

          if [ "$pr_tier" = "critical" ] || [ "$gov_replay_flag" = "true" ]; then
            run_strict_replay=true
            strict_replay_reason="Ran: tier=${pr_tier} and/or replay-impact flag."
          elif [ "$docs_only" = "true" ] || [ "$tests_only" = "true" ]; then
            strict_replay_reason="Skipped: ${pr_tier}-only change."
          fi

          if [ "$SECURITY" = "true" ] || [ "$RUNTIME" = "true" ] || [ "$GOVERNANCE" = "true" ] || [ "$gov_replay_flag" = "true" ]; then
            run_evidence_suite=true
            evidence_reason='Ran: governance/runtime/security path or replay-impact flag detected.'
          elif [ "$docs_only" = "true" ] || [ "$tests_only" = "true" ]; then
            evidence_reason="Skipped: ${pr_tier}-only change."
          fi

          if [ "$GOVERNANCE" = "true" ] || [ "$RUNTIME" = "true" ] || [ "$gov_policy_flag" = "true" ] || [ "$pr_tier" = "critical" ]; then
            run_promotion_suite=true
            promotion_reason='Ran: governance/runtime impact or policy-impact flag detected.'
          elif [ "$docs_only" = "true" ] || [ "$tests_only" = "true" ]; then
            promotion_reason="Skipped: ${pr_tier}-only change."
          fi

          if [ "$POLICY_TOUCH" = "true" ] || [ "$WEB_ASSETS_POLICY" = "true" ] || [ "$gov_policy_flag" = "true" ]; then
            run_shadow_governance_gate=true
            shadow_governance_reason='Ran: policy-touching/web-asset-policy paths or policy-impact flag detected.'
          fi

          if [ "$IS_PR" = "true" ] && [ "$pr_tier" = "critical" ]; then
            run_redteam_subset=true
            redteam_reason='Ran: PR critical-path deterministic red-team subset.'
          fi

          if [ "$SECURITY" = "true" ] || [ "$RUNTIME" = "true" ] || [ "$GOVERNANCE" = "true" ] || [ "$TESTS" = "true" ]; then
            run_adversarial_scenarios=true
            adversarial_reason='Ran: governance/runtime/security/tests path impact requires deterministic adversarial scenarios.'
          fi

          {
            echo "docs_only=$docs_only"
            echo "tests_only=$tests_only"
            echo "gov_policy_flag=$gov_policy_flag"
            echo "gov_replay_flag=$gov_replay_flag"
            echo "pr_tier=$pr_tier"
            echo "run_strict_replay=$run_strict_replay"
            echo "run_evidence_suite=$run_evidence_suite"
            echo "run_promotion_suite=$run_promotion_suite"
            echo "run_shadow_governance_gate=$run_shadow_governance_gate"
            echo "strict_replay_reason=$strict_replay_reason"
            echo "evidence_reason=$evidence_reason"
            echo "promotion_reason=$promotion_reason"
            echo "shadow_governance_reason=$shadow_governance_reason"
            echo "run_redteam_subset=$run_redteam_subset"
            echo "redteam_reason=$redteam_reason"
            echo "run_adversarial_scenarios=$run_adversarial_scenarios"
            echo "adversarial_reason=$adversarial_reason"
          } >> "$GITHUB_OUTPUT"

  schema-validation:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Validate governance policy schemas
        run: python scripts/validate_governance_schemas.py
      - name: Validate context memory schema and references
        run: python scripts/validate_context_memory.py
      - name: Block plaintext secrets in repository content
        run: python scripts/scan_secrets.py --path .

  docs-validation:
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
          requirements-file: requirements.dev.txt
      - name: Validate strict documentation snippets
        run: python scripts/validate_readme_alignment.py --format json
      - name: Enforce VERSION/pyproject/docs version sync
        run: python scripts/sync_versions.py --check
      - name: Validate manifest inventory alignment
        run: python scripts/validate_manifest_inventory.py --format json
      - name: Validate deterministic QR assets
        run: python scripts/generate_qr_assets.py --check
      - name: Validate markdown link and image integrity
        run: python scripts/validate_docs_integrity.py --format json
      - name: Validate active docs dependency references
        run: python scripts/lint_active_docs_dependency_refs.py --format json
      - name: Validate governance + release markdown link integrity
        run: >-
          python scripts/validate_docs_integrity.py
          --format json
          --roots docs/governance docs/comms docs/release docs/releases
      - name: Validate post-merge docs sync governance contract
        run: python scripts/validate_post_merge_doc_sync.py
      - name: Doc sync preview (pre-merge dry-run gate)
        run: python scripts/sync_docs_on_merge.py --dry-run --format json
      - name: Validate env-var inventory is current
        run: python scripts/validate_env_var_inventory.py
      - name: Validate deterministic changelog generation
        run: python scripts/generate_changelog.py --check

  doc-sync-preview:
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
          requirements-file: requirements.dev.txt
      - name: Doc sync preview (pre-merge dry-run gate)
        run: python scripts/sync_docs_on_merge.py --dry-run --format json

  workflow-python-version-guard:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Validate setup-python version pinning
        run: python scripts/check_workflow_python_version.py --expected-version 3.11.9

  workflow-integrity-validation:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Validate workflow integrity invariants
        run: python scripts/validate_workflow_integrity.py

  artifact-trust-verification:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Verify required signed artifacts
        run: PYTHONPATH=. python scripts/verify_critical_artifacts.py

  full-test-suite:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run full test suite
        run: PYTHONPATH=. pytest tests/ -q

  governance-tests:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run governance tests
        run: PYTHONPATH=. pytest tests/ -k governance -q

  determinism-lint:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Run determinism lint
        run: python tools/lint_determinism.py runtime/ security/ adaad/orchestrator/ app/main.py

  import-boundary-lint:
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Run import boundary lint
        # No pip install required — lint_import_paths.py uses stdlib only.
        run: python tools/lint_import_paths.py
      - name: Guard generated build/lib sources
        # No pip install required — validate_no_build_lib_sources.py uses stdlib only.
        run: python scripts/validate_no_build_lib_sources.py

  spdx-header-lint:
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Enforce SPDX license headers
        # No pip install required — check_spdx_headers.py uses stdlib only.
        run: python scripts/check_spdx_headers.py

  confidence-fast:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run fast confidence tests
        run: PYTHONPATH=. pytest tests/determinism/ tests/recovery/test_tier_manager.py -k "not shared_epoch_parallel_validation_is_deterministic_in_strict_mode" -q

  strict-replay:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_strict_replay == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Verify strict replay
        env:
          ADAAD_ENV: dev
          CRYOVANT_DEV_MODE: "1"
          ADAAD_FORCE_DETERMINISTIC_PROVIDER: "1"
          ADAAD_DETERMINISTIC_SEED: ci-strict-replay
        run: PYTHONPATH=. python -m app.main --verify-replay --replay strict

  evidence-suite:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_evidence_suite == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run evidence/sandbox tests
        run: PYTHONPATH=. pytest tests/sandbox/ -q

  promotion-suite:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_promotion_suite == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run promotion/governance tests
        run: PYTHONPATH=. pytest tests/governance/ tests/test_promotion_policy.py tests/test_promotion_state_machine.py -q

  shadow-governance-gate:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_shadow_governance_gate == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Run replay-only shadow governance evaluator
        run: >-
          python scripts/evaluate_shadow_governance.py
          --candidate governance/governance_policy_v1.json
          --dataset tests/fixtures/governance/shadow_replay_ledger.json
          --max-false-allow-rate 0.05
          --max-false-block-rate 0.20
          --max-divergence-count 3
          --output artifacts/shadow_governance_report.json

  qr-drift-validation:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.policy_touch == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Validate QR asset URL drift against canonical ledger
        run: python scripts/validate_qr_drift.py --format json --allow-unreachable

  phase6-amendment-gate-determinism:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.pr_tier == 'critical'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run Phase 6 amendment gate determinism selector
        run: >-
          PYTHONPATH=. pytest tests/autonomy/ -m autonomous_critical -k "phase6 and amendment and gate and determinism" -q

  phase6-storm-invariant:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.pr_tier == 'critical'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run Phase 6 storm invariant selector
        run: >-
          PYTHONPATH=. pytest tests/autonomy/test_evolution_loop_amendment.py -m autonomous_critical -k "test_storm_invariant_" -q

  phase6-human-signoff-path:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.pr_tier == 'critical'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run Phase 6 human signoff selector
        run: >-
          PYTHONPATH=. pytest tests/autonomy/test_evolution_loop_amendment.py -m autonomous_critical -k "test_no_auto_approval_" -q

  phase6-federated-propagation-all-or-nothing:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.pr_tier == 'critical'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run Phase 6 federated propagation all-or-nothing selector
        run: >-
          PYTHONPATH=. pytest tests/governance/federation/test_federated_amendment.py -k "all_or_nothing" -q

  phase6-federated-amendment-no-state-inheritance:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.pr_tier == 'critical'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run Phase 6 federated amendment no-state-inheritance selector
        run: >-
          PYTHONPATH=. pytest tests/governance/federation/test_federated_amendment.py -k "no_state_inheritance" -q

  amendment-formal-model-check:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.runtime == 'true' || needs.classify.outputs.security == 'true' || needs.classify.outputs.governance == 'true' || needs.classify.outputs.amendment_logic == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Run amendment formal model checker
        run: PYTHONPATH=. python tools/formal/amendment_state_model.py
      - name: Run amendment formal model tests
        run: PYTHONPATH=. pytest tests/formal/test_amendment_state_model.py -q

  phase7-reputation-gate:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.phase7_reputation_gate == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run Phase 7 reputation gate selector
        run: |
          PYTHONPATH=. pytest \
            tests/governance/test_reviewer_reputation.py \
            tests/governance/test_reviewer_reputation_ledger.py \
            tests/governance/test_review_pressure.py \
            -q
          PYTHONPATH=. pytest tests/test_constitution_policy.py -k "advisory_validators_do_not_mutate_envelope_state or cross_environment_digest_stability_with_equivalent_envelope_state or severity_escalation_framework_supports_warning_and_blocking" -q
          PYTHONPATH=. pytest tests/test_aponi_dashboard_e2e.py -k "reviewer_panel" -q


  redteam-critical-subset:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_redteam_subset == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run deterministic red-team critical subset
        run: PYTHONPATH=. python tools/run_redteam_harness.py --subset critical --output reports/redteam/critical.json

  adversarial-scenario-harness:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_adversarial_scenarios == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run deterministic adversarial scenario harness
        run: PYTHONPATH=. python tools/run_adversarial_scenario_harness.py --manifest tests/security/fixtures/adversarial_governance_scenarios.json --output reports/security/adversarial_scenarios_summary.json
      - name: Validate adversarial summary completeness
        run: python scripts/validate_release_evidence.py --require-adversarial-summary --adversarial-summary-path reports/security/adversarial_scenarios_summary.json
      - name: Upload adversarial summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-scenarios-summary
          path: reports/security/adversarial_scenarios_summary.json


  fast-path-innovations:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.runtime == 'true' || needs.classify.outputs.tests == 'true'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run fast-path innovation tests (route optimizer, entropy gate, checkpoint chain, parallel gate)
        run: |
          PYTHONPATH=. pytest \
            tests/test_mutation_route_optimizer.py \
            tests/test_entropy_fast_gate.py \
            tests/test_checkpoint_chain_new.py \
            tests/test_fast_path_scorer.py \
            tests/test_parallel_gate.py \
            -v --tb=short -q
      - name: Confirm fast-path modules importable (smoke)
        run: |
          PYTHONPATH=. python -c "
          from runtime.evolution.mutation_route_optimizer import MutationRouteOptimizer
          from runtime.evolution.entropy_fast_gate import EntropyFastGate
          from runtime.evolution.checkpoint_chain import build_checkpoint_chain
          from runtime.evolution.fast_path_scorer import fast_path_score
          from runtime.governance.parallel_gate import ParallelGovernanceGate
          print('ALL FAST-PATH MODULES IMPORTED OK')
          "

  # CI-DUPE-01: Renamed from semantic-diff-determinism to avoid silent job
  # shadowing.  GitHub Actions uses the last definition when two jobs share a
  # name; the first definition's fixture coverage was dead code.
  semantic-diff-determinism-baseline:
    runs-on: ubuntu-latest
    needs: classify
    # PR-PHASE4-07: Verify SemanticDiffEngine produces identical scores on identical AST inputs.
    # Runs on any runtime change; always-on for main pushes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          install-deps: "true"
      - name: Run semantic diff determinism verification
        run: |
          PYTHONPATH=. python - << 'PY'
          import hashlib, json

          FIXTURES = [
              ("empty",    "", ""),
              ("simple",   "def f(): pass", "def f(): return 1"),
              ("import",   "import os", "import os
import sys"),
              ("class",    "class A: pass", "class A:
    def m(self): pass"),
              ("complex",  "x=1", "def g(a,b,c):\n  for i in range(a):\n    if b: c()\n  return a"),
              ("noop",     "x=1", "x=1"),
              ("multiline","a=1\nb=2", "a=1\nb=2\nc=3"),
              ("risk_high", "pass", "\n".join(["import " + m for m in "os sys json re ast hashlib hmac secrets pathlib".split()])),
              ("nested",   "def f(): pass", "def f():\n  def g():\n    def h(): return 1\n  return g"),
              ("blank",    "   ", "   "),
          ]

          from runtime.evolution.semantic_diff import SemanticDiffEngine

          run1 = {}
          run2 = {}
          engine = SemanticDiffEngine()

          for name, before, after in FIXTURES:
              result1 = engine.diff(before_source=before, after_source=after)
              result2 = engine.diff(before_source=before, after_source=after)
              run1[name] = {"risk": round(result1.risk_score, 8), "complexity": round(result1.complexity_score, 8)}
              run2[name] = {"risk": round(result2.risk_score, 8), "complexity": round(result2.complexity_score, 8)}

          diverged = []
          for name in run1:
              if run1[name] != run2[name]:
                  diverged.append({"fixture": name, "run1": run1[name], "run2": run2[name]})

          if diverged:
              print("SEMANTIC_DIFF_DETERMINISM_FAILURE:", json.dumps(diverged, indent=2))
              raise SystemExit(1)

          digest = hashlib.sha256(json.dumps(run1, sort_keys=True).encode()).hexdigest()
          print(f"semantic-diff-determinism PASSED — {len(FIXTURES)} fixtures verified, digest={digest[:16]}")
          PY

