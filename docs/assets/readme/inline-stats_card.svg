<svg style="max-width:100%;height:auto" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sc-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/><stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <linearGradient id="sc-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/><stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <linearGradient id="sc-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4466"/><stop offset="100%" style="stop-color:#ff8800"/>
    </linearGradient>
    <linearGradient id="sc-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#ff4466"/>
    </linearGradient>
    <linearGradient id="sc-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/><stop offset="100%" style="stop-color:#ff8800"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="#070a10" rx="8"/>
  <rect width="1200" height="120" fill="none" stroke="#1a2332" stroke-width="1" rx="8"/>

  <!-- 5 stat blocks -->
  <!-- Version -->
  <rect x="10" y="10" width="222" height="100" rx="7" fill="#0b1420" stroke="#00d4ff" stroke-width="1"/>
  <text x="111" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="url(#sc-cyan)">v10.3.0</text>
  <text x="111" y="68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6a7a95" letter-spacing="2" text-transform="uppercase">CURRENT VERSION</text>
  <rect x="22" y="80" width="198" height="3" rx="1.5" fill="#0d1a2a"/>
  <rect x="22" y="80" width="198" height="3" rx="1.5" fill="url(#sc-cyan)"><animate attributeName="width" from="0" to="198" dur="1.4s" fill="freeze"/></rect>

  <!-- Phase -->
  <rect x="242" y="10" width="222" height="100" rx="7" fill="#091808" stroke="#00ff88" stroke-width="1"/>
  <text x="353" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="url(#sc-green)">192</text>
  <text x="353" y="68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6a7a95" letter-spacing="2">PHASES COMPLETE</text>
  <rect x="254" y="80" width="198" height="3" rx="1.5" fill="#091808"/>
  <rect x="254" y="80" width="192" height="3" rx="1.5" fill="url(#sc-green)"><animate attributeName="width" from="0" to="192" dur="1.4s" begin="0.2s" fill="freeze"/></rect>

  <!-- Invariants -->
  <rect x="474" y="10" width="222" height="100" rx="7" fill="#1a060e" stroke="#ff4466" stroke-width="1"/>
  <text x="585" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="url(#sc-red)">547</text>
  <text x="585" y="68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6a7a95" letter-spacing="2">HARD-CLASS INVARIANTS</text>
  <rect x="486" y="80" width="198" height="3" rx="1.5" fill="#1a060e"/>
  <rect x="486" y="80" width="195" height="3" rx="1.5" fill="url(#sc-red)"><animate attributeName="width" from="0" to="195" dur="1.4s" begin="0.4s" fill="freeze"/></rect>

  <!-- Innovations -->
  <rect x="706" y="10" width="222" height="100" rx="7" fill="#0f0820" stroke="#a855f7" stroke-width="1"/>
  <text x="817" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="url(#sc-purple)">97</text>
  <text x="817" y="68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6a7a95" letter-spacing="2">INNOVATIONS SHIPPED</text>
  <rect x="718" y="80" width="198" height="3" rx="1.5" fill="#0f0820"/>
  <rect x="718" y="80" width="185" height="3" rx="1.5" fill="url(#sc-purple)"><animate attributeName="width" from="0" to="185" dur="1.4s" begin="0.6s" fill="freeze"/></rect>

  <!-- Ledger -->
  <rect x="938" y="10" width="252" height="100" rx="7" fill="#120a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="1064" y="50" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="700" fill="url(#sc-amber)">48k+</text>
  <text x="1064" y="68" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#6a7a95" letter-spacing="2">LEDGER ENTRIES</text>
  <rect x="950" y="80" width="228" height="3" rx="1.5" fill="#120a00"/>
  <rect x="950" y="80" width="226" height="3" rx="1.5" fill="url(#sc-amber)"><animate attributeName="width" from="0" to="226" dur="1.4s" begin="0.8s" fill="freeze"/></rect>
</svg>
