  <text x="200" y="118" class="hg-title" font-size="62" fill="url(#hg-cyan)" filter="url(#hg-glow)">ADAAD</text>
  <text x="202" y="146" class="hg-sans" font-size="11.5" fill="#00d4ff" letter-spacing="5.5">AUTONOMOUS  DEVICE-ANCHORED  ADAPTIVE  DEVELOPMENT</text>
