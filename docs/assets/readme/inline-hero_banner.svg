<svg style="max-width:100%;height:auto" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <linearGradient id="hg-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <linearGradient id="hg-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4466"/>
      <stop offset="100%" style="stop-color:#ff8800"/>
    </linearGradient>
    <linearGradient id="hg-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ff4466"/>
    </linearGradient>
    <linearGradient id="hg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070a10"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
    <filter id="hg-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="hg-glow-sm">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .hg-title { font-family:'Segoe UI',Arial,sans-serif; font-weight:900; letter-spacing:14px; }
      .hg-mono  { font-family:'Courier New',monospace; font-weight:700; }
      .hg-sans  { font-family:'Segoe UI',Arial,sans-serif; }
      .hg-stat  { font-family:'Courier New',monospace; font-weight:700; font-size:26px; }
      .hg-lbl   { font-family:'Segoe UI',Arial,sans-serif; font-size:10px; fill:#6a7a95; text-transform:uppercase; letter-spacing:1.8px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#hg-bg)" rx="10"/>
  <rect width="1200" height="360" fill="none" stroke="#1a2332" stroke-width="1" rx="10"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#0d1520" stroke-width="1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#0d1520" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="360" stroke="#0d1520" stroke-width="1"/>
  <line x1="820" y1="0" x2="820" y2="360" stroke="#0d1520" stroke-width="1"/>

  <!-- Animated logo orb -->
  <g transform="translate(80,180)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.15">
      <animate attributeName="r" values="48;56;48" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#hg-cyan)" stroke-width="1.5">
      <animate attributeName="stroke-dasharray" values="0,240;240,0;0,240" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="22" fill="rgba(0,212,255,0.06)" stroke="#00d4ff" stroke-width="1"/>
    <!-- inner spinner -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <path d="M-14,-8 L0,16 L14,-8 Z" fill="url(#hg-cyan)" opacity="0.9"/>
    </g>
    <!-- pulse dot -->
    <circle cx="0" cy="0" r="4" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <!-- scan lines left of orb -->
    <line x1="-72" y1="-14" x2="-56" y2="-14" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="-70" y1="-4" x2="-52" y2="-4" stroke="#00ff88" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="-65" y1="6" x2="-50" y2="6" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

