<!DOCTYPE html>
<html lang="en">
<head>
<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- DORK v2.0 — ADAAD Advisory Intelligence                       -->
<!-- Integrated build: server key injection · live governance ·    -->
<!-- brand-aligned agent colors · full corpus system prompt        -->
<!-- Phase 130 · v9.63.0 · Innovative AI LLC                       -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dork — ADAAD Advisory Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   RESET
   ═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

/* ═══════════════════════════════════════════
   ADAAD BRAND PALETTE + DORK SURFACE VARS
   ═══════════════════════════════════════════ */
:root {
  /* ADAAD canonical brand */
  --void-black:      #0b0c0f;
  --graphite:        #16181d;
  --signal-white:    #f5f7fa;
  --ledger-gray:     #8c919b;
  --audit-gray:      #2b2f36;
  --architect-blue:  #3b82f6;
  --dream-violet:    #8b5cf6;
  --beast-orange:    #f97316;
  --state-success:   #22c55e;
  --state-warning:   #eab308;
  --state-blocked:   #ef4444;
  --state-sim:       #14b8a6;

  /* Dork surface (extends brand into deep UI) */
  --bg-deep:        #080c14;
  --bg-main:        #0b101c;
  --bg-surface:     #111827;
  --bg-elevated:    #1a2236;
  --bg-user:        #162032;
  --bg-dork:        #0d1520;

  --whale:          #00d9ff;
  --whale-dim:      rgba(0,217,255,0.18);
  --whale-glow:     rgba(0,217,255,0.07);
  --whale-border:   rgba(0,217,255,0.32);

  --text-primary:   #e6edf3;
  --text-secondary: #8b949e;
  --text-muted:     #484f58;

  --font-display:   'Syne', sans-serif;
  --font-body:      'DM Sans', sans-serif;
  --font-mono:      'DM Mono', monospace;

  --text-body:      17px;
  --text-label:     13px;
  --text-small:     11px;
  --lh:             1.72;

  --avatar:         46px;
  --msg-max:        80%;
  --chat-max:       880px;

  --r-sm:           8px;
  --r-md:           16px;
  --r-lg:           24px;
  --ease:           cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: var(--lh);
  background: var(--bg-deep);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════ */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ═══════════════════════════════════════════
   GOVERNANCE RIBBON
   ═══════════════════════════════════════════ */
#gov-ribbon {
  flex-shrink: 0;
  background: linear-gradient(180deg, #0d1220 0%, var(--bg-deep) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.055);
}

.gov-strip {
  max-width: var(--chat-max);
  margin: 0 auto;
  padding: 11px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.gov-brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 19px;
  color: var(--whale);
  letter-spacing: 0.4px;
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.gov-brand-sub {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,0.055);
  white-space: nowrap;
  transition: border-color 0.2s;
}
.badge.epoch {
  background: var(--whale-glow);
  border-color: var(--whale-border);
  color: var(--whale);
}
.badge.version {
  background: rgba(59,130,246,0.07);
  border-color: rgba(59,130,246,0.25);
  color: var(--architect-blue);
}
.badge.invariants {
  background: rgba(139,92,246,0.07);
  border-color: rgba(139,92,246,0.25);
  color: var(--dream-violet);
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}
.dot.green  { background: var(--state-success); box-shadow: 0 0 5px var(--state-success); }
.dot.whale  { background: var(--whale);         box-shadow: 0 0 5px var(--whale); }
.dot.red    { background: var(--state-blocked); box-shadow: 0 0 5px var(--state-blocked); }
.dot.amber  { background: var(--state-warning); box-shadow: 0 0 5px var(--state-warning); }
.dot.blue   { background: var(--architect-blue);box-shadow: 0 0 5px var(--architect-blue); }

.ribbon-btn {
  background: none; border: none;
  cursor: pointer; padding: 4px 8px;
  border-radius: var(--r-sm);
  transition: all 0.18s;
  font-size: 16px;
  color: var(--text-secondary);
}
.ribbon-btn:hover { color: var(--whale); background: var(--whale-glow); }
.ribbon-btn.cfg   { color: var(--text-muted); }
.ribbon-btn.cfg:hover { color: var(--text-secondary); background: rgba(255,255,255,0.04); }

/* ═══════════════════════════════════════════
   GOV DETAIL PANEL
   ═══════════════════════════════════════════ */
#gov-detail {
  max-width: var(--chat-max);
  margin: 0 auto;
  padding: 0 24px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s var(--ease), padding 0.3s;
}
#gov-detail.open {
  max-height: 440px;
  padding: 0 24px 18px;
}

.agent-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.agent-card {
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,0.055);
  border-radius: var(--r-md);
  padding: 14px 16px;
  border-top-width: 2px;
}
.agent-card.architect { border-top-color: var(--architect-blue); }
.agent-card.dream     { border-top-color: var(--dream-violet); }
.agent-card.beast     { border-top-color: var(--beast-orange); }

.agent-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
}
.agent-name.architect { color: var(--architect-blue); }
.agent-name.dream     { color: var(--dream-violet); }
.agent-name.beast     { color: var(--beast-orange); }

.agent-stat {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
  padding: 2px 0;
}
.agent-stat .val {
  color: var(--text-primary);
  font-family: var(--font-mono);
}

.gov-meta {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-secondary);
}
.gov-meta span { display: inline-flex; align-items: center; gap: 5px; }
.gov-meta .val { color: var(--text-primary); font-family: var(--font-mono); }

/* ═══════════════════════════════════════════
   CHAT AREA
   ═══════════════════════════════════════════ */
#chat-area {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-elevated) transparent;
}
#chat-area::-webkit-scrollbar { width: 5px; }
#chat-area::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }

#messages {
  max-width: var(--chat-max);
  margin: 0 auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ═══════════════════════════════════════════
   QUICK PROMPTS
   ═══════════════════════════════════════════ */
#quick-prompts {
  max-width: var(--chat-max);
  margin: 0 auto;
  padding: 0 24px 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
#quick-prompts.hidden { display: none; }

.qp {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-family: var(--font-body);
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,0.07);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}
.qp:hover {
  border-color: var(--whale-border);
  color: var(--whale);
  background: var(--whale-glow);
}

/* ═══════════════════════════════════════════
   MESSAGES
   ═══════════════════════════════════════════ */
.msg {
  display: flex;
  gap: 14px;
  max-width: var(--msg-max);
  animation: msgIn 0.3s var(--ease) both;
}
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.dork { align-self: flex-start; }

.msg-avatar {
  width: var(--avatar); height: var(--avatar);
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
}
.msg.dork .msg-avatar {
  background: linear-gradient(135deg, var(--whale-dim), var(--whale-glow));
  color: var(--whale);
  border: 2px solid var(--whale-border);
}
.msg.user .msg-avatar {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 2px solid rgba(255,255,255,0.07);
}

.msg-body { flex: 1; min-width: 0; }

.msg-sender {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 5px;
}
.msg.dork .msg-sender { color: var(--whale); }
.msg.user .msg-sender { color: var(--text-muted); text-align: right; }

.msg-content {
  padding: 16px 20px;
  border-radius: var(--r-md);
  font-size: var(--text-body);
  line-height: var(--lh);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.msg.dork .msg-content {
  background: var(--bg-dork);
  border: 1px solid rgba(255,255,255,0.048);
  border-left: 3px solid var(--whale-border);
  border-radius: 4px var(--r-md) var(--r-md) 4px;
}
.msg.user .msg-content {
  background: var(--bg-user);
  border: 1px solid rgba(255,255,255,0.055);
}

/* Markdown rendering inside messages */
.msg-content h2 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--whale);
  margin: 14px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(0,217,255,0.15);
}
.msg-content h3 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-secondary);
  margin: 12px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.msg-content p { margin: 6px 0; }
.msg-content strong { color: var(--whale); font-weight: 700; }
.msg-content em { color: var(--text-secondary); font-style: italic; }
.msg-content a { color: var(--architect-blue); text-decoration: underline; }
.msg-content code {
  font-family: var(--font-mono);
  font-size: 13px;
  background: rgba(0,0,0,0.32);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--whale);
}
.msg-content pre {
  background: rgba(0,0,0,0.38);
  border: 1px solid rgba(255,255,255,0.055);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  margin: 10px 0;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.55;
}
.msg-content pre code {
  background: none; padding: 0; color: var(--text-primary); font-size: 13px;
}
.msg-content ul, .msg-content ol {
  margin: 6px 0 6px 20px;
}
.msg-content li { margin: 3px 0; }
.msg-content table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin: 10px 0;
}
.msg-content th {
  background: rgba(0,217,255,0.07);
  color: var(--whale);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--whale-border);
  text-align: left;
}
.msg-content td {
  padding: 7px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-family: var(--font-mono);
  font-size: 13px;
}
.msg-content tr:last-child td { border-bottom: none; }
.msg-content hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.07);
  margin: 14px 0;
}
.msg-content blockquote {
  border-left: 3px solid var(--audit-gray);
  padding-left: 14px;
  color: var(--text-secondary);
  margin: 8px 0;
  font-style: italic;
}

.msg-time {
  font-size: var(--text-small);
  color: var(--text-muted);
  margin-top: 5px;
  font-family: var(--font-mono);
}
.msg.user .msg-time { text-align: right; }

/* ═══════════════════════════════════════════
   TYPING INDICATOR
   ═══════════════════════════════════════════ */
#typing-indicator {
  display: none;
  align-self: flex-start;
  align-items: center;
  gap: 10px;
  padding: 0 0 0 calc(var(--avatar) + 14px);
  animation: msgIn 0.3s var(--ease);
}
#typing-indicator.visible { display: flex; }

.typing-dots { display: flex; gap: 4px; }
.typing-dots span {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--whale);
  opacity: 0.35;
  animation: pulse 1.4s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
.typing-label {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  font-family: var(--font-mono);
}

/* ═══════════════════════════════════════════
   SCROLL TO BOTTOM
   ═══════════════════════════════════════════ */
#scroll-btn {
  position: fixed;
  bottom: 148px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  opacity: 0;
  pointer-events: none;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.09);
  color: var(--text-secondary);
  padding: 9px 18px;
  border-radius: 22px;
  font-size: 12px;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all 0.28s var(--ease);
  z-index: 10;
}
#scroll-btn.visible {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
#scroll-btn:hover {
  background: var(--whale-dim); color: var(--whale);
  border-color: var(--whale-border);
}

/* ═══════════════════════════════════════════
   INPUT AREA
   ═══════════════════════════════════════════ */
#input-area {
  flex-shrink: 0;
  background: linear-gradient(0deg, var(--bg-deep) 0%, var(--bg-main) 100%);
  border-top: 1px solid rgba(255,255,255,0.055);
  padding: 18px 24px;
}

.input-container { max-width: var(--chat-max); margin: 0 auto; }

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: var(--r-md);
  padding: 6px 6px 6px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-row:focus-within {
  border-color: var(--whale-border);
  box-shadow: 0 0 0 3px var(--whale-glow);
}

#user-input {
  flex: 1;
  background: none; border: none;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding: 11px 0;
  resize: none;
  max-height: 160px;
  outline: none;
}
#user-input::placeholder { color: var(--text-muted); }

#send-btn {
  width: 46px; height: 46px;
  border-radius: 11px; border: none;
  background: var(--whale);
  color: var(--bg-deep);
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  font-weight: 700;
}
#send-btn:hover { background: #30e3ff; transform: scale(1.05); }
#send-btn:active { transform: scale(0.94); }
#send-btn:disabled { opacity: 0.28; cursor: not-allowed; transform: none; }

.input-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 7px;
  font-size: var(--text-small);
  color: var(--text-muted);
  font-family: var(--font-mono);
  padding: 0 3px;
}
.input-footer .key-tag { background: var(--bg-elevated); border: 1px solid rgba(255,255,255,0.07); border-radius: 4px; padding: 1px 5px; }

/* ═══════════════════════════════════════════
   SERVER KEY BANNER
   ═══════════════════════════════════════════ */
#server-key-banner {
  max-width: var(--chat-max);
  margin: 0 auto 10px;
  padding: 8px 16px;
  background: rgba(34,197,94,0.07);
  border: 1px solid rgba(34,197,94,0.2);
  border-radius: var(--r-sm);
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--state-success);
  display: none;
  align-items: center;
  gap: 8px;
}
#server-key-banner.visible { display: flex; }

/* ═══════════════════════════════════════════
   CONFIG MODAL
   ═══════════════════════════════════════════ */
#cfg-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.62);
  backdrop-filter: blur(5px);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
#cfg-overlay.open { display: flex; }

#cfg-modal {
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--r-lg);
  padding: 30px;
  width: 90%; max-width: 460px;
  animation: modalIn 0.28s var(--ease);
}
#cfg-modal h2 {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 700;
  color: var(--whale);
  margin-bottom: 18px;
}
.cfg-field { margin-bottom: 14px; }
.cfg-field label {
  display: block;
  font-size: 11px; font-weight: 600;
  font-family: var(--font-display);
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.cfg-field input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: var(--r-sm);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 9px 13px;
  outline: none;
}
.cfg-field input:focus { border-color: var(--whale-border); }
.cfg-field .hint {
  font-size: 11px; color: var(--text-muted);
  margin-top: 4px; font-family: var(--font-mono);
}

.cfg-actions { display: flex; gap: 10px; margin-top: 22px; }
.cfg-actions button {
  flex: 1; padding: 11px;
  border-radius: var(--r-sm);
  font-family: var(--font-display);
  font-weight: 600; font-size: 13px;
  cursor: pointer; border: none;
  transition: all 0.18s;
}
.btn-save { background: var(--whale); color: var(--bg-deep); }
.btn-save:hover { background: #30e3ff; }
.btn-cancel {
  background: var(--bg-elevated); color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.07) !important;
}
.btn-cancel:hover { color: var(--text-primary); }
.btn-danger {
  background: rgba(239,68,68,0.1); color: var(--state-blocked);
  border: 1px solid rgba(239,68,68,0.18) !important;
}
.btn-danger:hover { background: rgba(239,68,68,0.2); }

/* ═══════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════ */
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 0.22; transform: scale(0.82); }
  50%      { opacity: 0.9;  transform: scale(1.12); }
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes epochPulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--whale-dim); }
  50%      { box-shadow: 0 0 0 5px transparent; }
}
.epoch-active { animation: epochPulse 2.2s ease-in-out infinite; }

/* ═══════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════ */

/* ═══════════════════════════════════════════
   MARKDOWN RENDERER — zero deps, ADAAD-aware
   ═══════════════════════════════════════════ */
function renderMd(raw) {
  // Step 1: protect code blocks from further processing
  const blocks = [];
  let s = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = blocks.length;
    blocks.push(`<pre><code class="lang-${lang || 'text'}">${esc(code.trim())}</code></pre>`);
    return `\x00BLOCK${idx}\x00`;
  });

  // Step 2: escape HTML outside code blocks
  s = s.split('\x00BLOCK').map((part, i) => {
    if (i === 0) return esc(part);
    const rest = part.replace(/^(\d+)\x00/, (_, idx) => {
      return `BLOCK_PLACEHOLDER_${idx}_`;
    });
    // crude: just handle the block idx
    return part;
  }).join('');

  // Re-approach: simpler two-pass
  const escaped = esc(raw);

  // Code blocks (on escaped content — just replace ``` sections)
  let out = escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="lang-${lang || 'text'}">${code.trim()}</code></pre>`
  );

  // Headers
  out = out.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  out = out.replace(/^## (.+)$/gm, '<h2>$1</h2>');

  // Horizontal rules
  out = out.replace(/^---+$/gm, '<hr>');

  // Blockquote
  out = out.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Tables (| header | header |)
  out = out.replace(/((?:\|.+\|\n?)+)/g, (block) => {
    const rows = block.trim().split('\n');
    if (rows.length < 2) return block;
    const sep = rows[1];
    if (!sep.match(/^\|[\s\-|]+\|$/)) return block;
    const headers = rows[0].split('|').filter(Boolean).map(h =>
      `<th>${h.trim()}</th>`).join('');
    const body = rows.slice(2).map(r => {
      const cells = r.split('|').filter(Boolean).map(c =>
        `<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table><thead><tr>${headers}</tr></thead><tbody>${body}</tbody></table>`;
  });

  // Unordered lists
  out = out.replace(/((?:^[-*] .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l =>
      `<li>${l.replace(/^[-*] /, '').trim()}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Ordered lists
  out = out.replace(/((?:^\d+\. .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l =>
      `<li>${l.replace(/^\d+\. /, '').trim()}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Inline: code (not inside pre)
  out = out.replace(/(?<!pre>)`([^`\n]+)`/g, '<code>$1</code>');

  // Bold & italic
  out = out.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(?<![*])\*([^*\n]+)\*(?![*])/g, '<em>$1</em>');

  // Line breaks (double newline = paragraph break)
  out = out.replace(/\n\n/g, '</p><p>');
  out = out.replace(/\n/g, '<br>');
  out = `<p>${out}</p>`;

  // Clean up wrapping around block elements
  out = out.replace(/<p>(<(?:h[23]|hr|pre|ul|ol|table|blockquote)[^>]*>)/g, '$1');
  out = out.replace(/(<\/(?:h[23]|pre|ul|ol|table|blockquote)>)<\/p>/g, '$1');
  out = out.replace(/<p><\/p>/g, '');

  return out;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ═══════════════════════════════════════════
   MESSAGE MANAGEMENT
   ═══════════════════════════════════════════ */
function addMsg(role, content, skipPush) {
  if (!skipPush) S.msgs.push({ role, content });

  const el = document.createElement('div');
  el.className = `msg ${role === 'user' ? 'user' : 'dork'}`;

  const avatar   = role === 'user' ? 'Y' : 'd';
  const sender   = role === 'user' ? 'You' : 'dork';
  const ts       = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  const rendered = role === 'user' ? `<p>${esc(content).replace(/\n/g,'<br>')}</p>` : renderMd(content);

  el.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-sender">${sender}</div>
      <div class="msg-content">${rendered}</div>
      <div class="msg-time">${ts}</div>
    </div>`;

  D.msgs.appendChild(el);
  scrollBottom();
  saveSession();
  return el;
}

/* ═══════════════════════════════════════════
   STREAMING — Direct Anthropic or server proxy
   ═══════════════════════════════════════════ */
async function stream() {
  if (S.streaming) return;
  const useProxy  = SERVER_KEY_AVAILABLE && !CFG.key;
  const hasKey    = !!CFG.key;
  if (!useProxy && !hasKey) {
    addMsg('assistant',
      '**No API key configured.** Open settings (⚙ or Ctrl+K) and add your Anthropic API key.\n\nIf the server has a key configured, it will appear as a green banner at the top.',
      true
    );
    return;
  }

  S.streaming = true;
  D.send.disabled = true;
  D.quickPrompts.classList.add('hidden');
  setTyping(true);

  const apiMsgs = S.msgs.map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.content,
  }));

  try {
    let res;
    if (useProxy) {
      // Server proxy — key never touches the browser
      res = await fetch(SERVER_PROXY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system:     buildSystemPrompt(),
          messages:   apiMsgs,
          model:      CFG.model,
          max_tokens: CFG.maxTokens,
        }),
      });
    } else {
      // Direct Anthropic
      res = await fetch(DIRECT_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'x-api-key':     CFG.key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model:      CFG.model,
          max_tokens: CFG.maxTokens,
          stream:     true,
          system:     buildSystemPrompt(),
          messages:   apiMsgs,
        }),
      });
    }

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`API ${res.status}: ${err.slice(0, 240)}`);
    }

    setTyping(false);
    const msgEl    = addMsg('assistant', '', true);
    const contentEl = msgEl.querySelector('.msg-content');
    let fullText = '';

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const evt = JSON.parse(data);
          if (evt.type === 'content_block_delta' && evt.delta?.text) {
            fullText += evt.delta.text;
            contentEl.innerHTML = renderMd(fullText);
            requestAnimationFrame(scrollBottom);
          }
        } catch (_) { /* ignore SSE parse errors */ }
      }
    }

    S.msgs.push({ role: 'assistant', content: fullText });
    saveSession();

  } catch (err) {
    setTyping(false);
    let hint = '';
    if (err.message.includes('401')) hint = '\n\n*Check your API key in settings.*';
    else if (err.message.includes('429')) hint = '\n\n*Rate limited — wait a moment.*';
    else if (err.message.includes('Failed to fetch')) hint = '\n\n*Network error — is the server running?*';
    addMsg('assistant', `**Error:** \`${err.message}\`${hint}`, true);
  } finally {
    S.streaming = false;
    D.send.disabled = false;
    D.input.focus();
  }
}

/* ═══════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════ */
function handleSend() {
  const text = D.input.value.trim();
  if (!text || S.streaming) return;
  addMsg('user', text);
  D.input.value = '';
  resize();
  stream();
}

function resize() {
  D.input.style.height = 'auto';
  D.input.style.height = Math.min(D.input.scrollHeight, 160) + 'px';
}

/* ═══════════════════════════════════════════
   GOVERNANCE POLLING
   ═══════════════════════════════════════════ */
async function pollGov() {
  try {
    const r = await fetch(CFG.gov);
    if (!r.ok) return;
    const data = await r.json();
    S.gov = data;
    renderGov(data);
  } catch (_) { /* governance is supplementary */ }
}

function renderGov(data) {
  const r = data?.runtime;
  if (!r) return;

  // Epoch badge
  D.epoch.innerHTML = `<span class="dot whale"></span> EPOCH ${r.epoch?.epoch || '?'} · Phase ${r.epoch?.phase || '?'}`;

  // Gate
  const ok = r.gov?.ok;
  D.gateDot.className = `dot ${ok ? 'green' : 'red'}`;
  D.gateText.textContent = ok ? 'GATE PASS' : 'GATE FAIL';

  // Version / invariants from live data if available
  if (r.epoch?.version) D.version.textContent = r.epoch.version;
  if (r.gov?.invariant_count) D.inv.textContent = `${r.gov.invariant_count} invariants`;

  // Replay
  if (r.rep?.score != null) {
    D.replayBadge.style.display = 'inline-flex';
    D.replayVal.textContent = r.rep.score.toFixed(3);
  }

  // Agent cards
  const agents = r.agents?.agents || {};
  const agentMeta = {
    architect: { cls: 'architect', label: 'Architect', keys: ['proposals','approved','rejected'] },
    dream:     { cls: 'dream',     label: 'Dream',     keys: ['tasks','safe_boots'] },
    beast:     { cls: 'beast',     label: 'Beast',     keys: ['validated','blocked'] },
  };

  D.agentGrid.innerHTML = Object.entries(agents).map(([name, a]) => {
    const meta  = agentMeta[name] || { cls: name, label: name, keys: [] };
    const sColor = a.status === 'healthy' ? 'green' : a.status === 'degraded' ? 'amber' : 'red';
    const stats = meta.keys.map(k =>
      `<div class="agent-stat"><span>${k}</span><span class="val">${a[k] ?? '—'}</span></div>`
    ).join('');
    return `<div class="agent-card ${meta.cls}">
      <div class="agent-name ${meta.cls}">
        <span class="dot ${sColor}"></span>${meta.label}
        <span style="margin-left:auto;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">${a.status || '—'}</span>
      </div>
      ${stats}
    </div>`;
  }).join('');

  // Meta row
  D.govMeta.innerHTML = [
    ['Constitution', r.gov?.constitution_version],
    ['Mutations',    r.muts?.total],
    ['Webhooks',     r.wh?.total],
    ['Readiness',    r.ready?.readiness_score != null ? ((r.ready.readiness_score*100).toFixed(0)+'%') : null],
    ['Divergence',   r.rep?.divergence],
    ['Tier',         r.gov?.tier],
  ].filter(([,v]) => v != null)
   .map(([k,v]) => `<span>${k} <span class="val">${v}</span></span>`)
   .join('');
}

/* ═══════════════════════════════════════════
   SESSION STORAGE PERSISTENCE
   ═══════════════════════════════════════════ */
function saveSession() {
  try { sessionStorage.setItem('dork_msgs', JSON.stringify(S.msgs)); } catch (_) {}
}

function loadSession() {
  try {
    const saved = sessionStorage.getItem('dork_msgs');
    if (!saved) return false;
    const msgs = JSON.parse(saved);
    if (!msgs.length) return false;
    S.msgs = msgs;
    msgs.forEach(m => {
      const el = addMsg(m.role, m.content, true);
    });
    return true;
  } catch (_) { return false; }
}

   UI UTILS
   ═══════════════════════════════════════════ */
function scrollBottom() {
  D.chat.scrollTop = D.chat.scrollHeight;
}

function setTyping(show) {
  D.typing.classList.toggle('visible', show);
  if (show) scrollBottom();
}

function checkScrollBtn() {
  const { scrollTop, scrollHeight, clientHeight } = D.chat;
  D.scrollBtn.classList.toggle('visible', scrollHeight - scrollTop - clientHeight > 120);
}

/* ═══════════════════════════════════════════
   CONFIG MODAL
   ═══════════════════════════════════════════ */
function openCfg() {
  q('#cfg-key').value   = CFG.key;
  q('#cfg-model').value = CFG.model;
  q('#cfg-gov').value   = CFG.gov;
  const hint = q('#key-hint');
  hint.textContent = SERVER_KEY_AVAILABLE
    ? '✅ Server API key is active — you can leave this blank.'
    : 'No server key detected. Enter your Anthropic API key here.';
  hint.style.color = SERVER_KEY_AVAILABLE ? 'var(--state-success)' : 'var(--text-muted)';
  D.cfgOverlay.classList.add('open');
}
function closeCfg() { D.cfgOverlay.classList.remove('open'); }
function saveCfg() {
  CFG.key   = q('#cfg-key').value.trim();
  CFG.model = q('#cfg-model').value.trim() || 'claude-sonnet-4-6';
  CFG.gov   = q('#cfg-gov').value.trim()   || '/api/whale/snapshot';
  closeCfg();
  if (S.govTimer) clearInterval(S.govTimer);
  pollGov();
  S.govTimer = setInterval(pollGov, CFG.pollMs);
}
function clearChat() {
  S.msgs = [];
  D.msgs.innerHTML = '';
  sessionStorage.removeItem('dork_msgs');
  D.quickPrompts.classList.remove('hidden');
  closeCfg();
  welcome();
}

/* ═══════════════════════════════════════════
   WELCOME
   ═══════════════════════════════════════════ */
function welcome() {
  addMsg('assistant', `Hey. I'm **dork** — ADAAD's advisory intelligence.

I have eyes on the governance substrate, the Constitutional Evolution Loop, the mutation pipeline, the agent triad, the Lineage Ledger, and the replay engine.

Right now ADAAD is at **v9.63.0**, Phase 130, with **201 Hard-class constitutional invariants** enforced. We just shipped INNOV-40 (Cross-Epoch Agent Learning Transfer), closing the collective intelligence track.

I'm read-only. Advisory only. Ask me what's happening — I'll tell you exactly what I see.

*Hit ▾ above to expand the live governance panel.*`, true);
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
function init() {
  /* Session ID */
  D.sessionLabel.textContent = `dork_sfp_${Math.random().toString(36).slice(2,10)}`;

  /* Static ribbon defaults (overwritten by live data) */
  D.version.textContent = 'v9.63.0';
  D.inv.textContent = '201 invariants';

  /* Server key banner */
  if (SERVER_KEY_AVAILABLE) {
    D.serverBanner.classList.add('visible');
  }

  /* Load session or show welcome */
  if (!loadSession()) {
    welcome();
  }

  /* Quick prompt chips */
  document.querySelectorAll('.qp').forEach(btn => {
    btn.addEventListener('click', () => {
      D.input.value = btn.dataset.q;
      resize();
      handleSend();
    });
  });

  /* Input */
  D.input.addEventListener('input', resize);
  D.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });
  D.send.addEventListener('click', handleSend);

  /* Governance panel toggle */
  D.govToggle.addEventListener('click', () => {
    S.govOpen = !S.govOpen;
    D.govDetail.classList.toggle('open', S.govOpen);
    D.govToggle.textContent = S.govOpen ? '▴' : '▾';
  });

  /* Scroll button */
  D.chat.addEventListener('scroll', checkScrollBtn);
  D.scrollBtn.addEventListener('click', () => {
    D.chat.scrollTo({ top: D.chat.scrollHeight, behavior: 'smooth' });
  });

  /* Config */
  D.cfgToggle.addEventListener('click', openCfg);
  q('#cfg-cancel').addEventListener('click', closeCfg);
  q('#cfg-save').addEventListener('click', saveCfg);
  q('#cfg-clear').addEventListener('click', clearChat);
  D.cfgOverlay.addEventListener('click', e => { if (e.target === D.cfgOverlay) closeCfg(); });

  /* Keyboard shortcuts */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')                           { closeCfg(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k')   { e.preventDefault(); openCfg(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'l')   { e.preventDefault(); clearChat(); return; }
    if (e.key === 'g' && !e.ctrlKey && !e.metaKey && document.activeElement !== D.input) {
      D.govToggle.click();
    }
  });

  /* No-key nudge (if neither server nor local key) */
  if (!SERVER_KEY_AVAILABLE && !CFG.key) {
    setTimeout(() => addMsg('assistant',
      '*Tip: Press **Ctrl+K** to open settings and add your Anthropic API key.*', true
    ), 1600);
  }

  /* Governance polling */
  pollGov();
  S.govTimer = setInterval(pollGov, CFG.pollMs);

  D.input.focus();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
