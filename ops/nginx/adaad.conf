# ADAAD Production Nginx — Subdomain Configuration
# Authority: HUMAN-0 · Dustin L. Reid
# Target: adaad.pro + subdomains
# Deploy: /etc/nginx/sites-available/adaad.conf → symlink to sites-enabled/
# Certbot: certbot --nginx -d adaad.pro -d aponi.adaad.pro -d api.adaad.pro -d docs.adaad.pro

# ── Redirect all HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    server_name adaad.pro www.adaad.pro aponi.adaad.pro api.adaad.pro docs.adaad.pro;
    return 301 https://$host$request_uri;
}

# ── adaad.pro — Landing page (static) ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name adaad.pro www.adaad.pro;

    ssl_certificate     /etc/letsencrypt/live/adaad.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaad.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/adaad/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
}

# ── aponi.adaad.pro — Aponi Governance Dashboard ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name aponi.adaad.pro;

    ssl_certificate     /etc/letsencrypt/live/adaad.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaad.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to ADAAD server (FastAPI on 8000)
    location / {
        proxy_pass         http://127.0.0.1:8000/ui/aponi/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket support (for live epoch streaming)
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
}

# ── api.adaad.pro — ADAAD REST API (FastAPI) ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.adaad.pro;

    ssl_certificate     /etc/letsencrypt/live/adaad.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaad.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limiting — protect governance endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req zone=api_limit burst=10 nodelay;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CORS — restrict to adaad.pro and aponi subdomain
        add_header Access-Control-Allow-Origin "https://adaad.pro" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-ADAAD-Token" always;
    }

    # SSE streaming endpoints — no proxy buffering
    location /api/dork/stream {
        proxy_pass         http://127.0.0.1:8000/api/dork/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
}

# ── docs.adaad.pro — GitHub Pages Redirect ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name docs.adaad.pro;

    ssl_certificate     /etc/letsencrypt/live/adaad.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaad.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to GitHub Pages (innovativeai-adaad.github.io/adaad/)
    location / {
        proxy_pass         https://innovativeai-adaad.github.io/adaad/;
        proxy_ssl_server_name on;
        proxy_set_header   Host innovativeai-adaad.github.io;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Accept-Encoding "";
        proxy_redirect     https://innovativeai-adaad.github.io/adaad/ https://docs.adaad.pro/;

        # Rewrite asset paths
        sub_filter 'href="/adaad/' 'href="/';
        sub_filter 'src="/adaad/'  'src="/';
        sub_filter_once off;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
}
